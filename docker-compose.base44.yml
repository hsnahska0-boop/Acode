services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=1
      - PORT=3000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX}
    command:
      - sh
      - -ec
      - |
        # 1. Copy browser Cordova shim to www/
        cp utils/browser-cordova-shim.js www/cordova.js

        # 2. Install dependencies
        npm install --no-audit --no-fund

        # 3. Build web assets with rspack (development mode, no DEV_MODE)
        npx rspack --mode development

        # 4. Start rspack watcher (background) + static server (foreground)
        npx rspack --watch --mode development &
        exec node utils/browser-serve.js
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure
